---
replicaCount: 1

imagePullPolicy: Always

image: "nginx"

imageTag: "latest"

containerName: ""
# Override default container name (defaults to Chart.Name if not set)

command: []
# Command to run in the main container
#  - "/bin/sh"
#  - "-c"
#  - "echo hello"

imagePullSecrets: []
#  - name: imagepullsecret1
#  - name: imagepullsecret2

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

deploymentAnnotations: {}
#  prometheus.io/scrape: "true"

deploymentStrategy: {}
# type: RollingUpdate
# rollingUpdate:
#   maxUnavailable: 0
#   maxSurge: 1

podAnnotations: {}

podLabels: {}

podSecurityContext: {}

shareProcessNamespace: false
# Enable process namespace sharing between containers in the pod
# When true, containers in the pod can see and signal processes from other containers

securityContext: {}
#   capabilities:
#     drop:
#     - ALL
#   readOnlyRootFilesystem: true
#   runAsNonRoot: true
#   runAsUser: 1000

service:
  name: http
  type: ClusterIP
  port: 80
  protocol: TCP

serviceMonitor:
  enabled: false
  name: ""
  namespace: ""
  labels: {}
  annotations: {}
  selector: {}
  namespaceSelector: {}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

route:
  enabled: false
  # route.gateway is required in simple mode when enabled=true.
  # Set spec to a complete HTTPRoute spec for advanced Gateway API configuration.
  spec: {}
  name: ""
  annotations: {}
  labels: {}
  gateway: ""
  gatewayNamespace: ""
  sectionName: ""
  hostname: chart-example.local
  path: /
  pathMatchType: PathPrefix
  backendWeight: 1
  timeouts: {}
  #  request: 75s
  #  backendRequest: 75s

extra:
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: extra.chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: extra.chart-example-tls
    #    hosts:
    #      - extra.chart-example.local

job:
  enabled: false
  name: my-job
  nameOverride: ""
  fullnameOverride: ""
  annotations: {}
  podAnnotations: {}
  extraLabels: {}
  serviceAccountName: ""
  serviceAccountAnnotations: {}
  image: ""
  imageTag: ""
  imagePullPolicy: IfNotPresent
  restartPolicy: OnFailure
  backoffLimit: 2
  ttlSecondsAfterFinished: null
  command: ["/bin/sh", "-c"]
  args: []
  # Job inherits base application env by default:
  # - .Values.env
  # - .Values.envFromSecrets (when enableEnvFrom=true)
  # - .Values.envSecrets.envs (when enableEnv=true)
  # Use job.env and job.envFrom for additional/override values.
  env: []
  #  - name: JOB_ENV
  #    value: production
  envFrom: []
  #  - secretRef:
  #      name: my-secret
  #  - configMapRef:
  #      name: my-config
  envFromSecrets: []
  #  - name: JOB_TOKEN
  #    secretName: my-job-secret
  #    secretKey: JOB_TOKEN
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

cronjob:
  enabled: false
  name: my-cronjob
  image: busybox
  imageTag: latest
  imagePullPolicy: IfNotPresent
  schedule: "*/5 * * * *"
  restartPolicy: OnFailure
  backoffLimit: 1
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  command: ["/bin/sh", "-c"]
  args: ["date >> /etc/cronlog/output.txt"]
  env: []
  #  - name: CRON_ENV
  #    value: production
  envFromSecrets:
    - name: API_KEY
      secretName: my-secret
      secretKey: API_KEY
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi


