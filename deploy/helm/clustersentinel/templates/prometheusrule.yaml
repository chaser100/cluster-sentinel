{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "clustersentinel.fullname" . }}
  labels:
    {{- include "clustersentinel.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- .Files.Get "alerts/clustersentinel.yaml" | trim | nindent 2 }}
{{- end }}
