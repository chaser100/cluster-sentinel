{{- if and .Values.mcpAuth.manageSecret (not .Values.mcpAuth.existingSecret) }}
{{- $secretName := required "mcpAuth.secretName is required when mcpAuth.manageSecret=true" .Values.mcpAuth.secretName }}
{{- $secretKey := required "mcpAuth.secretKey is required when mcpAuth.manageSecret=true" .Values.mcpAuth.secretKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "clustersentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-auth
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
data:
  {{ $secretKey }}: {{ if $existing }}{{ required (printf "Secret %s is missing key %s" $secretName $secretKey) (index ($existing.data | default dict) $secretKey) | quote }}{{ else }}{{ randAlphaNum 48 | b64enc | quote }}{{ end }}
{{- end }}
