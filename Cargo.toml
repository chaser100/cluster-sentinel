[package]
name = "clustersentinel"
version = "0.9.0"
edition = "2024"
rust-version = "1.89"
description = "Kubernetes cluster event sentinel with Prometheus metrics and embedded MCP"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.8", features = ["macros"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
futures = "0.3.31"
k8s-openapi = { version = "0.28.0", default-features = false, features = ["v1_33"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "runtime"] }
prometheus = { version = "0.14.0", default-features = false }
rmcp = { version = "3.2.0", features = ["server", "transport-io", "transport-streamable-http-server"] }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std"] }
schemars = "1.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
tower-http = { version = "0.6.6", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
http-body-util = "0.1.3"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.5.2", features = ["util"] }
tower-test = "0.4.0"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
