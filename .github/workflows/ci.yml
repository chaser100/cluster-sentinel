name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART_PATH: deploy/helm/clustersentinel
  CARGO_BUILD_JOBS: "1"

jobs:
  validate:
    name: Rust, Helm, and image checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: cluster-sentinel-k8s
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify synchronized release version
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          chart_version="$(awk '$1 == "version:" { print $2; exit }' "$CHART_PATH/Chart.yaml")"
          app_version="$(awk '$1 == "appVersion:" { gsub(/"/, "", $2); print $2; exit }' "$CHART_PATH/Chart.yaml")"
          cargo_version="$(awk '/^\[package\]$/ { package=1; next } /^\[/ { package=0 } package && /^version = / { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)"
          image_tag="$(awk '$0 == "clustersentinel:" { dependency=1; next } dependency && /^[^[:space:]]/ { dependency=0 } dependency && $1 == "imageTag:" { gsub(/"/, "", $2); print $2; exit }' "$CHART_PATH/values.yaml")"
          artifact_image_tag="$(awk '$1 == "image:" && $2 ~ /^chaser420\/cluster-sentinel:/ { split($2, parts, ":"); print parts[2]; exit }' "$CHART_PATH/Chart.yaml")"
          schema_image_tag="$(jq -r '.properties.clustersentinel.properties.imageTag.default' "$CHART_PATH/values.schema.json")"
          cargo_lock_version="$(awk '/^name = "clustersentinel"$/ { package=1; next } /^\[\[/ { package=0 } package && /^version = / { gsub(/"/, "", $3); print $3; exit }' Cargo.lock)"

          for version in "$app_version" "$cargo_version" "$cargo_lock_version" "$image_tag" "$artifact_image_tag" "$schema_image_tag"; do
            if [[ "$version" != "$chart_version" ]]; then
              echo "::error::Release versions are not synchronized: chart=$chart_version app=$app_version cargo=$cargo_version lock=$cargo_lock_version image=$image_tag artifact=$artifact_image_tag schema=$schema_image_tag"
              exit 1
            fi
          done

          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA:$CHART_PATH/Chart.yaml" 2>/dev/null; then
            base_version="$(git show "$BASE_SHA:$CHART_PATH/Chart.yaml" | awk '$1 == "version:" { print $2; exit }')"
            release_inputs_changed=false
            if git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | grep -Eq \
              '^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|Dockerfile|\.dockerignore|src/|tests/|observability/|deploy/helm/clustersentinel/)'; then
              release_inputs_changed=true
            fi
            if [[ "$release_inputs_changed" == true && "$base_version" == "$chart_version" ]]; then
              echo "::error::Application or Helm chart content changed without a chart version bump (current version: $chart_version)."
              exit 1
            fi
          fi

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.4

      - name: Validate Helm chart
        uses: ./.github/actions/validate-chart
        with:
          chart-path: ${{ env.CHART_PATH }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          buildkitd-config: .github/buildkitd.toml
          driver-opts: |
            memory=1536m
            memory-swap=1536m
            cpu-period=100000
            cpu-quota=200000

      - name: Build container image
        env:
          IMAGE_TAG: ci-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --load --platform linux/amd64 \
            --build-arg CARGO_BUILD_JOBS="$CARGO_BUILD_JOBS" \
            --build-arg BUILD_VERSION="$IMAGE_TAG" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag "cluster-sentinel:$IMAGE_TAG" \
            .

      - name: Scan container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cluster-sentinel:ci-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: LOW,MEDIUM,HIGH,CRITICAL
          version: v0.74.0
