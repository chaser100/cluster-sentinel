name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART_PATH: deploy/helm/clustersentinel

jobs:
  validate:
    name: Rust, Helm, and image checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify synchronized release version
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          chart_version="$(awk '$1 == "version:" { print $2; exit }' "$CHART_PATH/Chart.yaml")"
          app_version="$(awk '$1 == "appVersion:" { gsub(/"/, "", $2); print $2; exit }' "$CHART_PATH/Chart.yaml")"
          cargo_version="$(awk '/^\[package\]$/ { package=1; next } /^\[/ { package=0 } package && /^version = / { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)"
          image_tag="$(awk '$0 == "clustersentinel:" { dependency=1; next } dependency && /^[^[:space:]]/ { dependency=0 } dependency && $1 == "imageTag:" { gsub(/"/, "", $2); print $2; exit }' "$CHART_PATH/values.yaml")"
          artifact_image_tag="$(awk '$1 == "image:" && $2 ~ /^chaser420\/cluster-sentinel:/ { split($2, parts, ":"); print parts[2]; exit }' "$CHART_PATH/Chart.yaml")"

          for version in "$app_version" "$cargo_version" "$image_tag" "$artifact_image_tag"; do
            if [[ "$version" != "$chart_version" ]]; then
              echo "::error::Release versions are not synchronized: chart=$chart_version app=$app_version cargo=$cargo_version image=$image_tag artifact=$artifact_image_tag"
              exit 1
            fi
          done

          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA:$CHART_PATH/Chart.yaml" 2>/dev/null; then
            base_version="$(git show "$BASE_SHA:$CHART_PATH/Chart.yaml" | awk '$1 == "version:" { print $2; exit }')"
            if [[ "$base_version" == "$chart_version" ]]; then
              echo "::error::Chart version $chart_version already exists on the base revision. Bump it for this change."
              exit 1
            fi
          fi

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.4

      - name: Validate Helm chart
        shell: bash
        run: |
          set -euo pipefail
          helm repo add u-helm-chart https://chaser100.github.io/u-helm-chart
          helm dependency build "$CHART_PATH"
          helm lint "$CHART_PATH" --strict
          helm lint "$CHART_PATH" --strict --values "$CHART_PATH/tests/values-observability.yaml"
          helm template clustersentinel "$CHART_PATH" --namespace clustersentinel >/dev/null
          helm template clustersentinel "$CHART_PATH" \
            --namespace clustersentinel \
            --values "$CHART_PATH/tests/values-observability.yaml" >/dev/null

      - name: Validate observability artifacts
        shell: bash
        run: |
          set -euo pipefail
          jq empty observability/dashboards/clustersentinel.json
          cmp observability/alerts/clustersentinel.yaml "$CHART_PATH/alerts/clustersentinel.yaml"
          cmp observability/dashboards/clustersentinel.json "$CHART_PATH/dashboards/clustersentinel.json"

      - name: Build container image
        env:
          IMAGE_TAG: ci-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg BUILD_VERSION="$IMAGE_TAG" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag "cluster-sentinel:$IMAGE_TAG" \
            .
